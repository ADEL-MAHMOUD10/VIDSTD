[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imgstd"
version = "1.0.0"
description = "IMGSTD & VIDSTD: Semantic-Lossless 8-bit Image/Video Codec & Non-Vision AI Reference CLI/MCP"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "zstandard>=0.22.0",
    "av>=12.0.0",
    "rapidocr-onnxruntime>=1.2.0",
    "onnxruntime>=1.18.0",
    "pillow>=10.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
vision = [
    "torch>=2.2.0",
    "ultralytics>=8.0.0",
    "open_clip_torch>=2.24.0",
    "timm>=1.0.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.25.0",
]
neural = [
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
    "huggingface_hub>=0.25.0",
]
full = [
    "imgstd[vision,neural]",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
vidstd = "imgstd_project.cli:main"
imgstd = "imgstd_project.cli:main"
imgstd-mcp = "imgstd_project.server.mcp_server:main"

[tool.setuptools.packages.find]
include = ["imgstd_project*"]

[tool.setuptools.package-data]
imgstd_project = ["spec/*.json", "spec/*.md", "server/*.md"]
